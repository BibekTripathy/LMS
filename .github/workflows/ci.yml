name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lms_user
          POSTGRES_PASSWORD: lms_pass
          POSTGRES_DB: lms_test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U lms_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_NAME: lms_test_db
      DB_USER: lms_user
      DB_PASSWORD: lms_pass
      DB_HOST: localhost
      DB_PORT: 5432
      DEBUG: False
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        working-directory: backend
        run: |
          pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type-check
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-check:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        run: |
          docker build -t lms-backend:ci .

  publish:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, docker-check]
    # Only run on push events (which means merges to dev/main, not PRs)
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lms-backend
          TAG_SHA: ${{ github.sha }}
          TAG_BRANCH: ${{ github.ref_name }}
        run: |
          # Lowercase the repository owner to avoid docker tag errors
          LOWER_IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker build -t $LOWER_IMAGE_NAME:$TAG_SHA -t $LOWER_IMAGE_NAME:$TAG_BRANCH .
          docker push $LOWER_IMAGE_NAME:$TAG_SHA
          docker push $LOWER_IMAGE_NAME:$TAG_BRANCH
